'use strict';
/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const mod = (a, n) => ((a % n) + n) % n;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = k => k * k * (3 - 2 * k);
function parseColor(s) {
  if (!s) return { r: 0, g: 0, b: 0 };
  if (s[0] === '#') {
    return { r: parseInt(s.slice(1, 3), 16), g: parseInt(s.slice(3, 5), 16), b: parseInt(s.slice(5, 7), 16) };
  }
  const m = s.match(/(\d+)[^\d]+(\d+)[^\d]+(\d+)/);
  return m ? { r: +m[1], g: +m[2], b: +m[3] } : { r: 0, g: 0, b: 0 };
}
const rgbStr = c => `rgb(${Math.round(c.r)} ${Math.round(c.g)} ${Math.round(c.b)})`;

/* 两腿 IK：返回膝盖坐标（并修正脚点不超出腿长） */
function ik(hx, hy, fx, fy, l1, l2, bend) {
  let dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy) || 1e-4;
  const maxD = l1 + l2 - 0.5, minD = Math.abs(l1 - l2) + 0.5;
  if (d > maxD) { const s = maxD / d; dx *= s; dy *= s; d = maxD; }
  if (d < minD) { const s = minD / d; dx *= s; dy *= s; d = minD; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = hx + dx * a / d, my = hy + dy * a / d;
  return { kx: mx + (-dy / d) * h * bend, ky: my + (dx / d) * h * bend, fx: hx + dx, fy: hy + dy };
}

/* ================= 全局状态 ================= */

let tweens = [];
function tweenColor(el, attr, toHex) {
  tweens.push({ t: 0, dur: 0.9, el, attr, from: parseColor(el.getAttribute(attr)), to: parseColor(toHex), color: true });
}
function tweenVal(el, attr, to, dur) {
  tweens.push({ t: 0, dur: dur || 1.0, el, attr, from: parseFloat(el.getAttribute(attr) || '1'), to, color: false });
}
function stepTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const k = smooth(clamp(tw.t / tw.dur, 0, 1));
    if (tw.color) {
      const c = { r: tw.from.r + (tw.to.r - tw.from.r) * k,
                  g: tw.from.g + (tw.to.g - tw.from.g) * k,
                  b: tw.from.b + (tw.to.b - tw.from.b) * k };
      tw.el.setAttribute(tw.attr, rgbStr(c));
    } else {
      tw.el.setAttribute(tw.attr, (tw.from + (tw.to - tw.from) * k).toFixed(3));
    }
    if (tw.t >= tw.dur) tweens.splice(i, 1);
  }
}

function hillPath(amps, baseY) {
  let d = `M -100 470`;
  for (let x = -100; x <= 2500; x += 20) {
    let y = baseY;
    for (const [k, a, p] of amps) y -= a * Math.sin(2 * Math.PI * k * x / 1200 + p);
    d += ` L ${x} ${y.toFixed(1)}`;
  }
  return d + ' L 2500 470 Z';
}

/* ================= 音效：铃铛 ================= */
function ringBell() {
  bellT = 0.5; bellTextT = 1;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    [[1975, 0], [1568, 0.16], [2093, 0.32]].forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + d + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.5);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.55);
    });
  } catch (e) { /* 无音频环境就静默 */ }
}

/* ================= 动画主循环 ================= */
let bellT = 0, bellTextT = 0;
let blinkTimer = 2.5, blinkPhase = 0;
let flapTimer = 6, flapT = 0;
let last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  time += dt;

  stepTweens(dt);

  /* 铃铛抖动 & 文字（暂停时也能按） */
  if (bellT > 0) {
    bellT -= dt;
    const k = Math.max(0, bellT) / 0.5;
    $('bellG').setAttribute('transform', `translate(140 -130) rotate(${(Math.sin(time * 45) * 10 * k).toFixed(2)})`);
  }
  if (bellTextT > 0) {
    bellTextT -= dt * 0.8;
    const t = Math.max(0, bellTextT);
    $('bellText').setAttribute('opacity', t.toFixed(2));
    $('bellText').setAttribute('transform', `translate(640 ${(352 - 40 * (1 - t)).toFixed(1)})`);
  }

  if (!paused) {
    v += (targetV - v) * Math.min(1, dt * 1.6);
    dist += v * dt;
    theta += v * 0.022 * dt;
    wheelA += v / 54 * dt;
    offNear += v * dt;
    offMid += v * 0.45 * dt;
    offFar1 += v * 0.12 * dt;
    offFar2 += v * 0.2 * dt;
    km = dist / 45000;

    /* 里程碑 */
    const kmNow = Math.floor(km);
    if (kmNow > kmMark) { kmMark = kmNow; showToast(`🎉 已经骑了 ${kmNow} km 啦，真厉害！`); }
    $('odoChip').textContent = `🚲 ${km.toFixed(2)} km`;

    /* 自动换风景 */
    if (dist > nextBiomeDist) cycleBiome();

    /* 太阳呼吸 */
    $('sunGlow').setAttribute('r', (70 + 4 * Math.sin(time * 1.5)).toFixed(1));

    /* 山丘 */
    $('hillsBack').setAttribute('transform', `translate(${(-mod(offFar1, 1200)).toFixed(1)} 0)`);
    $('hillsFront').setAttribute('transform', `translate(${(-mod(offFar2, 1200)).toFixed(1)} 0)`);

    /* 云 */
    for (const c of clouds) {
      c.x -= (v * 0.06 + c.spd) * dt;
      if (c.x < -280) { c.x = 1340 + rand(0, 200); c.y = rand(40, 210); c.s = rand(0.7, 1.5); }
      c.g.setAttribute('transform', `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) scale(${c.s.toFixed(2)})`);
    }

    /* 飞鸟 */
    birdTimer -= dt;
    if (birdTimer <= 0 && birds.length < 4) {
      birdTimer = rand(6, 14);
      const p = document.createElementNS(svgNS, 'path');
      $('birdsG').appendChild(p);
      birds.push({ p, x: 1290, y: rand(50, 210), s: rand(0.8, 1.3), ph: rand(0, 6) });
    }
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i];
      b.x -= (65 + v * 0.18) * dt;
      if (b.x < -90) { b.p.remove(); birds.splice(i, 1); continue; }
      const up = Math.sin(time * 9 + b.ph) > 0;
      b.p.setAttribute('d', up ? 'M0 0 Q6 -7 12 0 Q18 -7 24 0' : 'M0 -2 Q6 4 12 -2 Q18 4 24 -2');
      b.p.setAttribute('transform', `translate(${b.x.toFixed(1)} ${b.y.toFixed(1)}) scale(${b.s})`);
    }

    /* 中景物件 */
    for (const s of midSlots) {
      const rel = mod(s.i * 220 + s.jitter - offMid, MID_SPAN);
      if (s.prevRel === null || rel > s.prevRel) reassignMid(s);
      s.prevRel = rel;
      s.g.setAttribute('transform', `translate(${(rel - 200).toFixed(1)} 552) scale(${s.scale.toFixed(2)})`);
    }

    /* 近景草丛 */
    for (const s of tufts) {
      const rel = mod(s.i * 120 + s.jitter - offNear, NEAR_SPAN);
      if (s.prevRel === null || rel > s.prevRel) {
        s.g.innerHTML = Math.random() < 0.6 ? tuftBuilders.grass() : tuftBuilders.flower();
      }
      s.prevRel = rel;
      s.g.setAttribute('transform', `translate(${(rel - 120).toFixed(1)} ${648 + (s.i % 3) * 9}) scale(${s.scale})`);
    }

    /* 路面虚线 */
    $('roadDash').setAttribute('stroke-dashoffset', (-mod(offNear, 80)).toFixed(1));

    /* 海面 */
    for (const sp of sparkles) {
      const x = mod(sp.x0 - offFar2 * 0.6, 1300) - 50;
      sp.el.setAttribute('x1', x.toFixed(1)); sp.el.setAttribute('x2', (x + sp.len).toFixed(1));
      sp.el.setAttribute('y1', sp.y); sp.el.setAttribute('y2', sp.y);
      sp.el.setAttribute('opacity', (0.25 + 0.35 * Math.abs(Math.sin(time * 2 + sp.ph))).toFixed(2));
    }
    $('boatG').setAttribute('transform',
      `translate(${(1250 - mod(offFar2 * 0.5 + time * 6, 1500)).toFixed(1)} ${(472 + 2 * Math.sin(time * 0.9)).toFixed(1)})`);

    /* 车轮 + 曲柄 */
    const wheelDeg = wheelA * 180 / Math.PI;
    $('spokesR').setAttribute('transform', `rotate(${wheelDeg.toFixed(1)})`);
    $('spokesF').setAttribute('transform', `rotate(${wheelDeg.toFixed(1)})`);
    const crankDeg = theta * 180 / Math.PI;
    $('crankNearG').setAttribute('transform', `rotate(${crankDeg.toFixed(1)} 62 -52)`);
    $('crankFarG').setAttribute('transform', `rotate(${(crankDeg + 180).toFixed(1)} 62 -52)`);

    /* 鹈鹕身体起伏 */
    const bobY = 2.4 * Math.sin(theta * 2);
    const bobR = 1.1 * Math.sin(theta * 2 + 0.6);
    $('riderG').setAttribute('transform', `translate(0 ${bobY.toFixed(2)}) rotate(${bobR.toFixed(2)} 8 -150)`);

    /* 双腿 IK */
    const hx = 26, hy = -126 + bobY;
    const pNx = 62 + 26 * Math.cos(theta), pNy = -52 + 26 * Math.sin(theta);
    const pFx = 62 + 26 * Math.cos(theta + Math.PI), pFy = -52 + 26 * Math.sin(theta + Math.PI);
    const legN = ik(hx, hy, pNx, pNy, 52, 58, -1);
    const legF = ik(hx, hy, pFx, pFy, 52, 58, -1);
    const setLine = (id, x1, y1, x2, y2) => {
      const el = $(id);
      el.setAttribute('x1', x1.toFixed(1)); el.setAttribute('y1', y1.toFixed(1));
      el.setAttribute('x2', x2.toFixed(1)); el.setAttribute('y2', y2.toFixed(1));
    };
    setLine('thighN', hx, hy, legN.kx, legN.ky);
    setLine('thighNo', hx, hy, legN.kx, legN.ky);
    setLine('shinN', legN.kx, legN.ky, legN.fx, legN.fy - 2);
    $('kneeN').setAttribute('cx', legN.kx.toFixed(1)); $('kneeN').setAttribute('cy', legN.ky.toFixed(1));
    $('footN').setAttribute('transform', `translate(${legN.fx.toFixed(1)} ${legN.fy.toFixed(1)})`);
    setLine('thighF', hx, hy, legF.kx, legF.ky);
    setLine('shinF', legF.kx, legF.ky, legF.fx, legF.fy - 2);
    $('kneeF').setAttribute('cx', legF.kx.toFixed(1)); $('kneeF').setAttribute('cy', legF.ky.toFixed(1));
    $('footF').setAttribute('transform', `translate(${legF.fx.toFixed(1)} ${legF.fy.toFixed(1)})`);

    /* 翅膀：随蹬踏轻摆 + 偶尔扇一下 */
    flapTimer -= dt;
    if (flapTimer <= 0) { flapTimer = rand(6, 12); flapT = 0.7; }
    let flap = 0;
    if (flapT > 0) { flap = Math.sin((0.7 - flapT) / 0.7 * Math.PI) * 24; flapT -= dt; }
    const wingAng = -8 + 3.5 * Math.sin(theta * 2 + 0.9) + flap;
    $('wingG').setAttribute('transform', `rotate(${wingAng.toFixed(2)} 12 -158)`);

    /* 眨眼 */
    blinkTimer -= dt;
    if (blinkTimer <= 0) { blinkTimer = rand(2.4, 5); blinkPhase = 0.18; }
    if (blinkPhase > 0) blinkPhase -= dt;
    const eyeS = blinkPhase > 0 ? 0.12 : 1;
    $('eyeG').setAttribute('transform', `translate(96 -236) scale(1 ${eyeS}) translate(-96 236)`);

    /* 围巾 & 帽带飘动 */
    const lift = v * 0.006;
    let d1 = 'M 62 -196', d2 = 'M 62 -196';
    for (let i = 1; i <= 3; i++) {
      const px = 62 - i * 17;
      const py = -196 + Math.sin(time * 7 + i * 1.4) * (2 + i * 2) - lift * i;
      d1 += ` L ${px.toFixed(1)} ${py.toFixed(1)}`;
      d2 += ` L ${px.toFixed(1)} ${(py + 1.5).toFixed(1)}`;
    }
    $('scarfTail').setAttribute('d', d1);
    $('scarfTailHi').setAttribute('d', d2);
    let d3 = 'M 72 -251';
    for (let i = 1; i <= 2; i++) {
      d3 += ` L ${(72 - i * 13).toFixed(1)} ${(-251 + Math.sin(time * 8 + i * 2) * (1.5 + i * 1.5) - lift * i * 0.6).toFixed(1)}`;
    }
    $('hatRibbon').setAttribute('d', d3);

    /* 鱼尾巴摆一摆 */
    $('fishG').setAttribute('transform', `translate(174 -118) rotate(${(-30 + Math.sin(time * 3) * 6).toFixed(1)})`);

    /* 花瓣微粒 */
    for (const p of particles) {
      p.x -= (v * 0.8 + 18 + p.spd) * dt;
      p.y += Math.sin(time * 2 + p.ph) * 0.35 + 0.15;
      if (p.x < -20) { p.x = 1240 + rand(0, 100); p.y = rand(280, 620); }
      if (p.y > 665) p.y = 300;
      p.el.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${(30 * Math.sin(time * 3 + p.ph)).toFixed(1)})`);
    }

    /* 速度线 */
    const streakO = clamp((v - 260) / 240, 0, 1) * 0.55;
    $('streaks').setAttribute('opacity', streakO.toFixed(2));
    if (streakO > 0) {
      for (const s of streaks) {
        s.x -= (v * 1.35 + 60) * dt;
        if (s.x < -180) { s.x = 1300 + rand(0, 200); s.y = rand(350, 530); s.len = rand(50, 140); }
        s.el.setAttribute('x1', s.x.toFixed(1)); s.el.setAttribute('x2', (s.x + s.len).toFixed(1));
        s.el.setAttribute('y1', s.y.toFixed(1)); s.el.setAttribute('y2', s.y.toFixed(1));
      }
    }
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
